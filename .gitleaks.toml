# Gitleaks configuration for FlowScout
# ref: https://github.com/gitleaks/gitleaks

title = "FlowScout Gitleaks Config"

[extend]
# Use default gitleaks ruleset as baseline
useDefault = true

[[rules]]
id = "flowscout-vault-key"
description = "FlowScout vault key"
regex = '''FLOWSCOUT_VAULT_KEY\s*=\s*['"]?[A-Za-z0-9+/=]{32,}['"]?'''
tags = ["key", "flowscout"]

[allowlist]
description = "Global allowlist"
paths = [
  ".env.example",
  "CLAUDE.md",
  "docs/",
]
regexes = [
  # Placeholder values in example files
  '''FLOWSCOUT_VAULT_KEY=your-secret-key-here''',
  '''PLACEHOLDER''',
]
